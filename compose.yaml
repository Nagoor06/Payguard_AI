services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payguard
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard -d payguard"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: payguard
      DB_USER: payguard
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in .env}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:?Set REVIEWER_API_KEY in .env}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
      # For Bedrock mode, run with appropriate IAM role or AWS credentials forwarding.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  pgdata:
